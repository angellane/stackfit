name: Script error or crash
description: One of the scripts failed, crashed, or produced broken output.
labels: ["bug"]
body:
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: python scripts/analyze_stack.py . --format text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or traceback
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
  - type: textarea
    id: repo
    attributes:
      label: What kind of repo was it run on?
      description: Language, framework, monorepo or not. A link helps if it's public.

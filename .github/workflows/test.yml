name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check scripts run on this repository
        run: |
          python scripts/analyze_stack.py . --format json > /dev/null
          python scripts/impact_scan.py . --domain payments --format json > /dev/null
          python scripts/score_candidates.py --template | python scripts/score_candidates.py - --format json > /dev/null
          python scripts/github_probe.py probe --help > /dev/null
